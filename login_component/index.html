<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP Fábrica de Alho</title>
    <!-- Habilita fontes do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #060913;
            background-image: 
                radial-gradient(circle at 10% 85%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 15%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 3. Limitação do Container Principal (Filosofia Mobile-First a 420px) */
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 4. O Card Glassmorphism (Formulário) */
        .login-card {
            background: rgba(11, 17, 33, 0.45);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-top: 1px solid rgba(255, 255, 255, 0.14); /* Brilho superior */
            border-radius: 24px;
            padding: 35px 25px 25px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
        }

        /* 8. Estilos Personalizados das Estruturas HTML */
        .login-logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .login-logo-container img {
            width: 130px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.12));
            margin-bottom: 12px;
            display: inline-block;
        }
        
        .login-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin: 0;
            letter-spacing: 0.5px;
        }
        
        .login-subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
            text-align: center;
            margin-top: 4px;
            margin-bottom: 22px;
        }
        
        /* Linha decorativa de divisão de cor */
        .color-divider {
            height: 2px;
            width: 50px;
            margin: 0 auto 15px auto;
            background: linear-gradient(90deg, #10b981 0%, #7c3aed 100%);
            border-radius: 2px;
        }

        /* Ícones dos módulos */
        .modules-bar {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .module-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 4px 6px;
            border-radius: 6px;
        }
        
        .mod-prod { color: #10b981; }
        .mod-est { color: #a78bfa; }
        .mod-com { color: #f59e0b; }
        .mod-fin { color: #3b82f6; }

        /* Estilização das Divs de Input */
        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .input-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-left: 2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 13px 15px 13px 42px; /* Espaço para o ícone da esquerda */
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper input:focus {
            border-color: rgba(16, 185, 129, 0.6);
            background-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.25);
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Ícones internos dos inputs */
        .input-icon-left {
            position: absolute;
            left: 14px;
            color: rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-wrapper input:focus + .input-icon-left {
            color: #10b981;
        }

        /* Ícone de olho (visibilidade da senha) */
        .input-icon-right {
            position: absolute;
            right: 14px;
            color: rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.3s ease;
            user-select: none;
            padding: 4px;
            border-radius: 4px;
        }

        .input-icon-right:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Lembrar-me e Esqueci minha senha */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 24px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            display: none;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .checkbox-container:hover .custom-checkbox {
            border-color: rgba(16, 185, 129, 0.5);
        }

        .checkbox-container input:checked + .custom-checkbox {
            background-color: #10b981;
            border-color: #10b981;
        }

        .checkbox-container input:checked + .custom-checkbox::after {
            content: "";
            width: 5px;
            height: 9px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .checkbox-label {
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
        }

        .forgot-link {
            color: #a78bfa;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            opacity: 0.85;
            transition: opacity 0.2s ease, text-shadow 0.2s ease;
        }

        .forgot-link:hover {
            opacity: 1;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.3);
        }

        /* O Botão Degradê de Login */
        .login-btn {
            background: linear-gradient(135deg, #10b981 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 20px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.45);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }

        /* Rodapé interno do card */
        .card-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 15px;
        }

        /* Banner de Erro */
        .error-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 20px;
            color: #fca5a5;
            font-size: 13px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Rodapé externo - Powered by Daatel */
        .daatel-brand-footer {
            position: fixed;
            bottom: 20px;
            right: 25px;
            text-align: right;
            opacity: 0.8;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .daatel-brand-footer:hover {
            opacity: 1;
        }
        .daatel-brand-footer span {
            display: block;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 2px;
        }
        .daatel-brand-footer h4 {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .daatel-brand-footer p {
            margin: 2px 0 0 0;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Cabeçalho (Logo e Módulos) -->
            <div class="login-logo-container">
                <img id="logo-img" src="" alt="Logo" style="display: none;">
                <h2 class="login-title">EMPORIO DO ALHO</h2>
                <div class="login-subtitle">Sistema Integrado de Gestão</div>
                <div class="color-divider"></div>
                
                <div class="modules-bar">
                    <div class="module-item mod-prod">🌱 PRODUÇÃO</div>
                    <div class="module-item mod-est">📦 ESTOQUE</div>
                    <div class="module-item mod-com">🛒 COMERCIAL</div>
                    <div class="module-item mod-fin">📊 FINANCEIRO</div>
                </div>
            </div>

            <!-- Banner de Erro Dinâmico -->
            <div id="error-banner" class="error-banner" style="display: none;">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-text">E-mail ou senha incorreta.</span>
            </div>

            <!-- Formulário -->
            <form id="login-form">
                <!-- Campo E-mail -->
                <div class="input-group">
                    <label class="input-label" for="email">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="Digite seu e-mail" required autocomplete="email">
                        <span class="input-icon-left">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Campo Senha -->
                <div class="input-group">
                    <label class="input-label" for="password">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Digite sua senha" required autocomplete="current-password">
                        <span class="input-icon-left">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <span class="input-icon-right" id="toggle-password">
                            <svg id="eye-open" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eye-closed" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Lembrar-me e Esqueci minha senha -->
                <div class="options-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="remember" checked>
                        <span class="custom-checkbox"></span>
                        <span class="checkbox-label">Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="alert('Funcionalidade em desenvolvimento. Por favor, contate o administrador.'); return false;">Esqueci minha senha</a>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="login-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    <span>Entrar</span>
                </button>
            </form>

            <!-- Rodapé Card -->
            <div class="card-footer">
                <span>🛡️ Ambiente Corporativo</span>
                <span>|</span>
                <span>Versão 1.0.0</span>
            </div>

        </div>
    </div>

    <!-- Assinatura Powered by Daatel -->
    <div class="daatel-brand-footer">
        <span>Powered by</span>
        <h4>DAATEL</h4>
        <p>Wisdom into Technology</p>
    </div>

    <script>
        // --- 1. Lógica do Botão de Visibilidade de Senha ---
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            if (type === 'password') {
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            } else {
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            }
        });

        // --- 2. Lógica de Comunicação com o Streamlit ---
        function sendMessage(type, data) {
            window.parent.postMessage({
                type: type,
                ...data
            }, "*");
        }

        // Listener para receber dados do Streamlit (Logo e Erros)
        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                const args = event.data.args;
                
                // Envia altura de tela cheia para evitar cortes
                sendMessage("streamlit:setFrameHeight", { height: window.innerHeight });

                // Renderiza o logotipo em Base64 se disponível
                if (args.logo_b64) {
                    const logoImg = document.getElementById("logo-img");
                    logoImg.src = "data:image/png;base64," + args.logo_b64;
                    logoImg.style.display = "inline-block";
                }

                // Renderiza erro dinâmico se enviado pelo Python
                const errorBanner = document.getElementById("error-banner");
                const errorText = document.getElementById("error-text");
                if (args.error_msg) {
                    errorText.textContent = args.error_msg;
                    errorBanner.style.display = "flex";
                } else {
                    errorBanner.style.display = "none";
                }
            }
        });

        // --- 3. Lógica de Submissão do Formulário ---
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Envia credenciais de volta ao Python de forma reativa e segura
            sendMessage("streamlit:setComponentValue", {
                value: {
                    email: email,
                    password: password
                }
            });
        });
    </script>
</body>
</html>
