name: Disparo Automático do Relatório Executivo

on:
  schedule:
    # 15:00 UTC = 12:00 Horário de Brasília
    # 22:00 UTC = 19:00 Horário de Brasília
    - cron: '0 15,22 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary pandas streamlit

    - name: Executar Disparo do Relatório Executivo
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python send_report_cron.py
